name: Render Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & FFmpeg
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Rendering Script
        run: |
          python render_script.py

      - name: Send Video Back to n8n Webhook
        if: success()
        run: |
          curl -X POST "${{ github.event.client_payload.webhook_url || 'https://returning-precipitation-natrix-commodities.trycloudflare.com/webhook-test/fe994d8f-38a9-4cc9-90a1-aaac881f9f27' }}" \
            -F "video=@output.mp4"
            
