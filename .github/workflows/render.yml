name: Render Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & FFmpeg
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Rendering Script
        run: |
          python render_script.py

      - name: Send Video Back to n8n
        if: success()
        run: |
          CLEAN_URL=$(echo "${{ github.event.client_payload.webhook_url }}" | sed -E 's/.*(https?:\/\/[^]\) "]+).*/\1/')
          curl -X POST "$CLEAN_URL" \
            -F "data=@output.mp4"
